---
- name: Install Keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true

- name: Deploy Pi-hole health check
  ansible.builtin.template:
    src: check-pihole.sh.j2
    dest: "{{ keepalived_check_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Keepalived

- name: Deploy Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Keepalived

- name: Ensure Keepalived is enabled and started
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
