---
- name: Read current Pi-hole DNS hosts
  ansible.builtin.command:
    cmd: pihole-FTL --config dns.hosts
  register: pihole_dns_hosts_current
  changed_when: false
  check_mode: false

- name: Build desired Pi-hole DNS hosts
  ansible.builtin.set_fact:
    pihole_dns_hosts_desired: >-
      {{
        pihole_dns_records
        | map(attribute='address')
        | zip(pihole_dns_records | map(attribute='name'))
        | map('join', ' ')
        | list
      }}

- name: Configure Pi-hole DNS hosts
  ansible.builtin.command:
    argv:
      - pihole-FTL
      - --config
      - dns.hosts
      - "{{ pihole_dns_hosts_desired | to_json }}"
  when:
    - (pihole_dns_hosts_current.stdout | trim) !=
      (pihole_dns_hosts_desired | to_json)
  notify: Restart Pi-hole
