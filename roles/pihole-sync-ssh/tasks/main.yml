---
- name: Create SSH directory for sync user
  ansible.builtin.file:
    path: "{{ pihole_sync_ssh_directory }}"
    state: directory
    owner: "{{ pihole_sync_user }}"
    group: "{{ pihole_sync_user }}"
    mode: "0700"

- name: Generate Gravity synchronization SSH key
  community.crypto.openssh_keypair:
    path: "{{ pihole_sync_ssh_private_key }}"
    type: ed25519
    owner: "{{ pihole_sync_user }}"
    group: "{{ pihole_sync_user }}"
    mode: "0600"
    comment: "Pi-hole Gravity synchronization"

- name: Read synchronization public key
  ansible.builtin.slurp:
    src: "{{ pihole_sync_ssh_public_key }}"
  register: pihole_sync_public_key
  when: pihole_sync_source | bool

- name: Install synchronization public key on destination
  ansible.posix.authorized_key:
    user: "{{ pihole_sync_destination_user }}"
    key: "{{ pihole_sync_public_key.content | b64decode }}"
    state: present
    comment: "Pi-hole Gravity synchronization"
  delegate_to: "{{ pihole_sync_destination_host }}"
  when: pihole_sync_source | bool

- name: Allow synchronization user to run sqlite3_rsync as pihole
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/pihole-gravity-sync"
    content: |
      {{ pihole_sync_user }} ALL=(pihole) NOPASSWD: /usr/bin/pihole-FTL sqlite3_rsync *
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: Verify sudo configuration
  ansible.builtin.command:
    cmd: "sudo -n -u pihole pihole-FTL sqlite3_rsync --help"
  become: false
  changed_when: false
