---
- name: Ensure pihole home directory exists
  ansible.builtin.file:
    path: "{{ pihole_sync_source_home }}"
    state: directory
    owner: "{{ pihole_sync_source_user }}"
    group: "{{ pihole_sync_source_user }}"
    mode: "0755"

- name: Create pihole SSH directory
  ansible.builtin.file:
    path: "{{ pihole_sync_ssh_directory }}"
    state: directory
    owner: "{{ pihole_sync_source_user }}"
    group: "{{ pihole_sync_source_user }}"
    mode: "0700"

- name: Generate Gravity synchronization SSH key
  community.crypto.openssh_keypair:
    path: "{{ pihole_sync_ssh_private_key }}"
    type: ed25519
    owner: "{{ pihole_sync_source_user }}"
    group: "{{ pihole_sync_source_user }}"
    mode: "0600"
    comment: "Pi-hole Gravity synchronization"

- name: Read synchronization public key
  ansible.builtin.slurp:
    src: "{{ pihole_sync_ssh_public_key }}"
  register: pihole_sync_public_key
  when: pihole_sync_source | bool

- name: Install synchronization public key on destination
  ansible.posix.authorized_key:
    user: "{{ pihole_sync_destination_user }}"
    key: "{{ pihole_sync_public_key.content | b64decode }}"
    state: present
    comment: "Pi-hole Gravity synchronization"
  delegate_to: "{{ pihole_sync_destination_host }}"
  when: pihole_sync_source | bool

- name: Install remote sqlite3_rsync wrapper
  ansible.builtin.copy:
    dest: "{{ pihole_sync_remote_wrapper }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      exec sudo -n -u {{ pihole_sync_service_user }} \
        /usr/bin/pihole-FTL sqlite3_rsync "$@"

- name: Configure restricted sudo access for Gravity synchronization
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/pihole-gravity-sync"
    owner: root
    group: root
    mode: "0440"
    content: |
      {{ pihole_sync_destination_user }} ALL=(pihole) NOPASSWD: /usr/bin/pihole-FTL sqlite3_rsync *
    validate: "/usr/sbin/visudo -cf %s"

- name: Scan destination SSH host key
  ansible.builtin.command:
    cmd: "ssh-keyscan -t ed25519 {{ pihole_sync_destination_host }}"
  register: pihole_sync_host_key
  changed_when: false
  when: pihole_sync_source | bool

- name: Ensure destination SSH host key is known
  ansible.builtin.known_hosts:
    path: "{{ pihole_sync_ssh_directory }}/known_hosts"
    name: "{{ pihole_sync_destination_host }}"
    key: "{{ pihole_sync_host_key.stdout }}"
    state: present
  become: true
  become_user: "{{ pihole_sync_source_user }}"
  when:
    - pihole_sync_source | bool
    - pihole_sync_host_key.stdout | length > 0
