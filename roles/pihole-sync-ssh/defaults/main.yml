---
pihole_sync_source: false

# SSH transport
pihole_sync_ssh_user: "shackadmin"
pihole_sync_destination_user: "shackadmin"

pihole_sync_ssh_directory: "/home/shackadmin/.ssh"
pihole_sync_ssh_private_key: "{{ pihole_sync_ssh_directory }}/pihole_gravity_sync"
pihole_sync_ssh_public_key: "{{ pihole_sync_ssh_private_key }}.pub"

# Pi-hole service account
pihole_sync_service_user: "pihole"

# Destination
pihole_sync_destination_host: "shack-dns-p002"

# Database
pihole_sync_database: "/etc/pihole/gravity.db"
